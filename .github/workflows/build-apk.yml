name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i @capacitor/core@6 @capacitor/android@6
          npm i -D @capacitor/cli@6

      - name: Stage web assets into www/
        run: |
          mkdir -p www
          cp -r index.html sw.js manifest.json css js vendor icons www/

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Add location permissions to AndroidManifest
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: demon-finder-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
